# Shared dependencies. Private skills and plugins stay in agents.private.toml.
version = 1
agents = ["claude", "codex", "opencode", "pi"]

[trust]
github_repos = ["emilkowalski/skills"]

[[skills]]
name = "*"
source = "emilkowalski/skills"
ref = "e8a175de22ae1e49370fc144c1f3bb9aeedf988d"
path = "skills"
exclude = ["emil-design-eng"]

[[plugins]]
name = "superpowers"
source = "path:./plugin-sources/superpowers"
path = "."
targets = ["claude", "codex"]

[[plugins]]
name = "chrome-devtools-mcp"
source = "path:./plugin-sources/chrome-devtools-mcp"
path = "."
targets = ["claude"]
